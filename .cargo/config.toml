# Windows-Programm unter Linux bauen (mingw-w64): cargo build --release --target x86_64-pc-windows-gnu
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# Ist die Windows-Standardbibliothek über rustup nicht erreichbar, aus den Quellen bauen:
# RUSTC_BOOTSTRAP=1 cargo build --release --target x86_64-pc-windows-gnu -Zbuild-std=std,panic_abort
