name: Bauen und testen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev
      - run: cargo test --release
      - run: cargo build --release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $d = "rustwave-$v-windows-x64"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/rustwave.exe, LICENSE, README.md, CHANGELOG.md $d
          Copy-Item assets/DejaVu-LICENSE.txt, assets/kappanhang-LICENSE.txt, docs/THIRD-PARTY.md $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
          echo "PAKET=$d.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: rustwave-windows
          path: ${{ env.PAKET }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PAKET }}
          generate_release_notes: true
